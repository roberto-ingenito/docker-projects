<div class="dialog-container">
  <h2 mat-dialog-title>{{ data.shelf ? 'Modifica Scaffale' : 'Nuovo Scaffale' }}</h2>
  <mat-dialog-content>
    <form [formGroup]="form" class="shelf-form">
      <mat-form-field class="full-width">
        <mat-label>Nome Scaffale</mat-label>
        <mat-icon matPrefix>label</mat-icon>
        <input matInput formControlName="label" placeholder="Es. A1, Settore 1..." />
        @if (form.get('label')?.hasError('required')) {
          <mat-error>Il nome è obbligatorio</mat-error>
        }
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Note</mat-label>
        <mat-icon matPrefix>notes</mat-icon>
        <textarea matInput formControlName="notes" placeholder="Note opzionali..." rows="3"></textarea>
      </mat-form-field>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Annulla</button>
    <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid || saving">
      @if (saving) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        {{ data.shelf ? 'Aggiorna' : 'Crea' }}
      }
    </button>
  </mat-dialog-actions>
</div>
