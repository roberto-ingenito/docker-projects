<mat-sidenav-container>
  <mat-sidenav #sidenav mode="over" autoFocus="dialog">
    <mat-nav-list>
      <a mat-list-item routerLink="dashboard" routerLinkActive="active" (click)="sidenav.close()">
        Dashboard
      </a>
      <a mat-list-item routerLink="categories" routerLinkActive="active" (click)="sidenav.close()">
        Categorie
      </a>
      <a
        mat-list-item
        routerLink="transactions"
        routerLinkActive="active"
        (click)="sidenav.close()"
      >
        Transazioni
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <nav>
      <div class="nav-inner">
        <button
          mat-icon-button
          type="button"
          class="menu-button"
          aria-label="Apri menu"
          (click)="sidenav.toggle()"
        >
          <mat-icon>menu</mat-icon>
        </button>

        <span class="page-title">{{ pageTitle() }}</span>

        <div class="links">
          <a routerLink="dashboard" routerLinkActive="active">Dashboard</a>
          <a routerLink="categories" routerLinkActive="active">Categorie</a>
          <a routerLink="transactions" routerLinkActive="active">Transazioni</a>
        </div>

        <div class="actions">TODO</div>
      </div>
    </nav>

    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
