<header>
  <div class="title">
    <h1>Transazioni</h1>
    <p>Gestisci le tue entrate e uscite</p>
  </div>

  <div class="actions">
    <app-button variant="secondary" icon="filter_alt">Filtri</app-button>
    <app-button variant="primary" icon="add_2">Nuova transazione</app-button>
  </div>
</header>

<main>
  <p>{{ transactionsStore.state()?.length ?? 0 }} transazioni</p>
  <div class="transaction-list">
    @for (item of transactionsStore.state(); track $index) {
      <app-transaction-card [transaction]="item" />
    }
  </div>
</main>
